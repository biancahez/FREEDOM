<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FREEDOMS</title>
    <style>
      @font-face {
        font-family: "Galano";
        src: url("./fonts/GalanoGrotesqueMedium.otf") format("opentype");
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Galano";
        src: url("./fonts/GalanoGrotesqueSemiBold.otf") format("opentype");
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Galano";
        src: url("./fonts/GalanoGrotesqueMediumItalic.otf") format("opentype");
        font-weight: 500;
        font-style: italic;
        font-display: swap;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #a8a6d3;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: "Galano", "Segoe UI", Roboto, system-ui, sans-serif;
        font-weight: 500;
        padding: 2rem 1.5rem;
        color: #fee62d;
        position: relative;
        overflow: auto;
      }

      .bg-float {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .float-item {
        position: fixed;
        left: 0;
        top: 0;
        border-radius: 0;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        object-fit: cover;
        will-change: transform, opacity;
        pointer-events: none;
      }

      .content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 600px;
        padding-bottom: 4rem;
      }

      .name-title {
        font-size: 4.5rem;
        font-weight: 600;
        letter-spacing: 3px;
        color: #fee62d;
        text-align: center;
        text-shadow: 0 2px 25px rgba(168, 166, 211, 0.8);
        line-height: 1.1;
        word-break: break-word;
        padding: 0 1rem;
      }

      .name-spacer {
        height: 0.5rem;
      }

      .subtitle {
        font-size: 1.5rem;
        letter-spacing: 2px;
        text-align: center;
        color: #fee62d;
        opacity: 0.9;
        font-style: italic;
        font-weight: 500;
        margin-bottom: 1.2rem;
      }

      .counter {
        font-size: 0.95rem;
        opacity: 0.85;
        margin-bottom: 0.6rem;
        letter-spacing: 1px;
        text-align: center;
      }
      .counter span {
        color: #fff;
        font-weight: 700;
      }

      .stage {
        width: min(440px, 85vw);
        aspect-ratio: 160 / 190;
        perspective: 1500px;
        position: relative;
      }

      .card {
        width: 100%;
        height: 100%;
        cursor: pointer;
        user-select: none;
        transition: transform 0.2s ease;
      }

      .card.locked {
        cursor: default;
        filter: grayscale(0.2) brightness(0.8);
      }

      .card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        transition: transform 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        transform-style: preserve-3d;
        border-radius: 0;
        box-shadow:
          0 25px 40px -15px rgba(0, 0, 0, 0.4),
          0 0 60px rgba(254, 230, 45, 0.2);
      }

      .card.flipped .card-inner {
        transform: rotateY(180deg);
      }

      .card-front,
      .card-back {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 0;
        overflow: hidden;
        border: 2px solid rgba(254, 230, 45, 0.7);
      }

      .card-front img,
      .card-back img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .card-back {
        transform: rotateY(0deg);
        background: #8a88b8;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card-front {
        transform: rotateY(180deg);
        background: #8a88b8;
      }

      .card-back .back-hint {
        color: #fee62d;
        font-size: 1.5rem;
        font-weight: 500;
        letter-spacing: 1px;
        text-align: center;
        padding: 0 1.5rem;
        line-height: 1.5;
        opacity: 0.9;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        pointer-events: none;
      }

      .placeholder-text {
        color: #fee62d;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        background: repeating-linear-gradient(
          45deg,
          #9997c8,
          #9997c8 10px,
          #8a88b8 10px,
          #8a88b8 20px
        );
      }

      .tap-hint {
        margin-top: 0.8rem;
        font-size: 0.9rem;
        opacity: 0.75;
        letter-spacing: 1px;
        text-align: center;
        height: 1.6rem;
        min-height: 1.6rem;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        white-space: nowrap;
        transition: opacity 0.3s;
      }

      .actions {
        margin-top: 0.3rem;
        display: flex;
        gap: 0.8rem;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        background: #fee62d;
        border: 2px solid #fee62d;
        color: #a8a6d3;
        font-family: inherit;
        font-size: 1.15rem;
        font-weight: 600;
        padding: 0.8rem 1.6rem;
        border-radius: 0.6rem;
        cursor: pointer;
        letter-spacing: 2px;
        transition: all 0.2s ease;
        text-transform: uppercase;
      }

      .btn:hover:not(:disabled) {
        background: transparent;
        color: #fee62d;
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(254, 230, 45, 0.35);
      }

      .btn:active:not(:disabled) {
        transform: translateY(1px);
      }

      .btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
        filter: grayscale(0.5);
      }

      .collection-modal {
        position: fixed;
        inset: 0;
        background: rgba(30, 27, 46, 0.85);
        backdrop-filter: blur(8px);
        z-index: 100;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
      }
      .collection-modal.show {
        display: flex;
      }

      .collection-panel {
        background: #a8a6d3;
        border: 2px solid rgba(254, 230, 45, 0.9);
        border-radius: 1.5rem;
        padding: 1.5rem;
        width: 100%;
        max-width: 800px;
        max-height: 85vh;
        display: flex;
        flex-direction: column;
      }

      .collection-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
      }

      .collection-title {
        font-size: 1.6rem;
        font-weight: 600;
        color: #fee62d;
        letter-spacing: 2px;
      }

      .collection-close {
        background: transparent;
        border: 2px solid #fee62d;
        color: #fee62d;
        font-size: 1.2rem;
        width: 2.4rem;
        height: 2.4rem;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
      }
      .collection-close:hover {
        background: #fee62d;
        color: #a8a6d3;
      }

      .collection-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
        gap: 0.8rem;
        overflow-y: auto;
        padding: 0.5rem;
      }

      .collection-empty {
        text-align: center;
        color: #fee62d;
        opacity: 0.8;
        padding: 2rem;
        font-style: italic;
      }

      .collection-item {
        aspect-ratio: 160 / 190;
        overflow: hidden;
        border: 2px solid rgba(254, 230, 45, 0.7);
        border-radius: 6px;
        cursor: zoom-in;
        transition: transform 0.15s ease;
      }
      .collection-item:hover {
        transform: scale(1.05);
      }
      .collection-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .lightbox {
        position: fixed;
        inset: 0;
        background: rgba(15, 12, 30, 0.92);
        z-index: 200;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        cursor: pointer;
      }
      .lightbox.show {
        display: flex;
      }
      .lightbox img {
        max-width: 90vw;
        max-height: 90vh;
        object-fit: contain;
        border: 2px solid rgba(254, 230, 45, 0.9);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      }

      @media (max-width: 600px) {
        .name-title {
          font-size: 2.8rem;
          letter-spacing: 2px;
        }
        .name-spacer {
          height: 0.4rem;
        }
        .subtitle {
          font-size: 1.2rem;
          margin-bottom: 1rem;
        }
        .actions {
          flex-direction: column;
          align-items: center;
          width: 100%;
        }
        .btn {
          width: 100%;
        }
        .collection-grid {
          grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-float" id="bgFloat"></div>

    <div class="content">
      <div class="name-title" id="nameTitle">—</div>
      <div class="name-spacer"></div>
      <div class="subtitle">becomes...</div>

      <div class="counter" id="counter">
        Drawn <span id="drawnCount">0</span> / <span id="limitCount">8</span>
      </div>

      <div class="stage">
        <div class="card" id="card">
          <div class="card-inner">
            <div class="card-back" id="cardBack"></div>
            <div class="card-front" id="cardFront"></div>
          </div>
        </div>
      </div>

      <div class="tap-hint" id="tapHint"></div>

      <div class="actions">
        <button class="btn" id="againBtn" disabled>DRAW AGAIN</button>
        <button class="btn" id="collectionBtn">MY COLLECTION</button>
        <button class="btn" id="homeBtn">START OVER</button>
      </div>
    </div>

    <div class="collection-modal" id="collectionModal">
      <div class="collection-panel">
        <div class="collection-header">
          <div class="collection-title">MY COLLECTION</div>
          <button class="collection-close" id="collectionClose">✕</button>
        </div>
        <div class="collection-grid" id="collectionGrid"></div>
        <div
          class="collection-empty"
          id="collectionEmpty"
          style="display: none"
        >
          Nothing collected yet. Draw a card first!
        </div>
      </div>
    </div>

    <div class="lightbox" id="lightbox">
      <img id="lightboxImg" src="" alt="Card enlarged" />
    </div>

    <script>
      (function () {
        const cards = [
          { front: "./front/1.png", back: "./back/1back.png" },
          { front: "./front/2.png", back: "./back/2back.png" },
          { front: "./front/3.png", back: "./back/3back.png" },
          { front: "./front/4.png", back: "./back/4back.png" },
          { front: "./front/5.png", back: "./back/5back.png" },
          { front: "./front/6.png", back: "./back/6back.png" },
          { front: "./front/7.png", back: "./back/7back.png" },
          { front: "./front/8.png", back: "./back/8back.png" },
          { front: "./front/9.png", back: "./back/9back.png" },
          { front: "./front/10.png", back: "./back/10back.png" },
          { front: "./front/11.png", back: "./back/11back.png" },
          { front: "./front/12.png", back: "./back/12back.png" },
          { front: "./front/13.png", back: "./back/13back.png" },
          { front: "./front/14.png", back: "./back/14back.png" },
          { front: "./front/15.png", back: "./back/15back.png" },
          { front: "./front/16.png", back: "./back/16back.png" },
          { front: "./front/17.png", back: "./back/17back.png" },
          { front: "./front/18.png", back: "./back/18back.png" },
          { front: "./front/19.png", back: "./back/19back.png" },
          { front: "./front/20.png", back: "./back/20back.png" },
          { front: "./front/21.png", back: "./back/21back.png" },
          { front: "./front/22.png", back: "./back/22back.png" },
          { front: "./front/23.png", back: "./back/23back.png" },
          { front: "./front/24.png", back: "./back/24back.png" },
          { front: "./front/25.png", back: "./back/25back.png" },
          { front: "./front/26.png", back: "./back/26back.png" },
          { front: "./front/27.png", back: "./back/27back.png" },
          { front: "./front/28.png", back: "./back/28back.png" },
          { front: "./front/29.png", back: "./back/29back.png" },
          { front: "./front/30.png", back: "./back/30back.png" },
          { front: "./front/31.png", back: "./back/31back.png" },
          { front: "./front/32.png", back: "./back/32back.png" },
          { front: "./front/33.png", back: "./back/33back.png" },
          { front: "./front/34.png", back: "./back/34back.png" },
          { front: "./front/35.png", back: "./back/35back.png" },
          { front: "./front/36.png", back: "./back/36back.png" },
          { front: "./front/37.png", back: "./back/37back.png" },
          { front: "./front/38.png", back: "./back/38back.png" },
          { front: "./front/39.png", back: "./back/39back.png" },
          { front: "./front/40.png", back: "./back/40back.png" },
          { front: "./front/41.png", back: "./back/41back.png" },
        ];

        const FLOAT_IMAGES = cards.map((c) => c.front);
        const FLOAT_COUNT = 18;
        const DRAW_LIMIT = 8;

        const STORAGE_KEY = "freedoms_collection";
        const NAME_KEY = "freedoms_current_name";

        const bgFloat = document.getElementById("bgFloat");
        const nameTitle = document.getElementById("nameTitle");
        const cardEl = document.getElementById("card");
        const cardBackEl = document.getElementById("cardBack");
        const cardFrontEl = document.getElementById("cardFront");
        const tapHint = document.getElementById("tapHint");
        const againBtn = document.getElementById("againBtn");
        const homeBtn = document.getElementById("homeBtn");
        const collectionBtn = document.getElementById("collectionBtn");
        const collectionModal = document.getElementById("collectionModal");
        const collectionClose = document.getElementById("collectionClose");
        const collectionGrid = document.getElementById("collectionGrid");
        const collectionEmpty = document.getElementById("collectionEmpty");
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightboxImg");
        const drawnCountEl = document.getElementById("drawnCount");
        const limitCountEl = document.getElementById("limitCount");

        let state = 0;
        let isFlipped = false;
        let currentName = "";
        let drawnCount = 0;
        let currentCard = null;
        let hasFlippedBack = false;

        // ✅ 新增：牌堆（保证 8 张不重复）
        let deck = [];

        let lightboxCards = [];
        let lightboxIndex = 0;
        let lightboxShowBack = false;

        function getCollection() {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            return raw ? JSON.parse(raw) : [];
          } catch (e) {
            return [];
          }
        }

        function addToCollection(cardIndex) {
          const list = getCollection();
          if (!list.includes(cardIndex)) {
            list.push(cardIndex);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
          }
        }

        // 洗牌：Fisher-Yates
        function shuffle(arr) {
          const a = arr.slice();
          for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
          }
          return a;
        }

        // ---------- 漂浮背景：飞出屏幕后从另一侧随机重生 ----------
        function createFloatItems() {
          if (!bgFloat) return;
          bgFloat.innerHTML = "";

          const items = [];

          for (let i = 0; i < FLOAT_COUNT; i++) {
            const img = document.createElement("img");
            img.className = "float-item";
            const src =
              FLOAT_IMAGES[Math.floor(Math.random() * FLOAT_IMAGES.length)];
            img.src = src;
            img.alt = "";
            img.onerror = function () {
              console.error("❌ 图片加载失败：", this.src);
            };

            const size = 280 + Math.random() * 200;
            img.style.width = size + "px";
            img.style.height = size * 1.1875 + "px";

            let x = Math.random() * window.innerWidth;
            let y = Math.random() * window.innerHeight;

            const speed = 40 + Math.random() * 80;
            const angle = Math.random() * Math.PI * 2;
            let vx = Math.cos(angle) * speed;
            let vy = Math.sin(angle) * speed;

            let rotation = Math.random() * 360;
            let rotSpeed = (Math.random() - 0.5) * 40;

            img.style.transform = `translate(${x}px, ${y}px) rotate(${rotation}deg)`;
            img.style.opacity = "0.32";

            bgFloat.appendChild(img);

            items.push({
              el: img,
              x,
              y,
              w: size,
              h: size * 1.1875,
              vx,
              vy,
              rotation,
              rotSpeed,
              opacityBase: 0.2 + Math.random() * 0.15,
              fadePhase: Math.random() * Math.PI * 2,
              fadeSpeed: 0.5 + Math.random() * 1.0,
            });
          }

          let lastTime = performance.now();

          function animate(now) {
            const dt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;

            items.forEach((it) => {
              it.x += it.vx * dt;
              it.y += it.vy * dt;
              it.rotation += it.rotSpeed * dt;
              it.fadePhase += it.fadeSpeed * dt;
              const opacity = it.opacityBase + Math.sin(it.fadePhase) * 0.1;

              const margin = 50;
              const offLeft = it.x < -it.w - margin;
              const offRight = it.x > window.innerWidth + margin;
              const offTop = it.y < -it.h - margin;
              const offBottom = it.y > window.innerHeight + margin;

              if (offLeft || offRight || offTop || offBottom) {
                if (offLeft) {
                  it.x = window.innerWidth + it.w;
                  it.y = Math.random() * window.innerHeight;
                } else if (offRight) {
                  it.x = -it.w;
                  it.y = Math.random() * window.innerHeight;
                } else if (offTop) {
                  it.y = window.innerHeight + it.h;
                  it.x = Math.random() * window.innerWidth;
                } else if (offBottom) {
                  it.y = -it.h;
                  it.x = Math.random() * window.innerWidth;
                }

                const newSpeed = 40 + Math.random() * 80;
                const newAngle = Math.random() * Math.PI * 2;
                it.vx = Math.cos(newAngle) * newSpeed;
                it.vy = Math.sin(newAngle) * newSpeed;
                it.rotSpeed = (Math.random() - 0.5) * 40;

                const newSize = 280 + Math.random() * 200;
                it.w = newSize;
                it.h = newSize * 1.1875;
                it.el.style.width = newSize + "px";
                it.el.style.height = newSize * 1.1875 + "px";
                it.el.src =
                  FLOAT_IMAGES[Math.floor(Math.random() * FLOAT_IMAGES.length)];
              }

              it.el.style.transform = `translate(${it.x}px, ${it.y}px) rotate(${it.rotation}deg)`;
              it.el.style.opacity = opacity.toFixed(2);
            });

            requestAnimationFrame(animate);
          }

          requestAnimationFrame(animate);
        }

        function createImg(src, alt) {
          const img = document.createElement("img");
          img.src = src;
          img.alt = alt;
          img.onerror = function () {
            this.style.display = "none";
            const parent = this.parentElement;
            if (parent && !parent.querySelector(".placeholder-text")) {
              const ph = document.createElement("div");
              ph.className = "placeholder-text";
              ph.textContent = "Image not found";
              parent.appendChild(ph);
            }
          };
          return img;
        }

        function updateCounter() {
          drawnCountEl.textContent = drawnCount;
          limitCountEl.textContent = DRAW_LIMIT;
        }

        function showPurpleBack() {
          state = 0;
          hasFlippedBack = false;
          isFlipped = false;
          cardEl.classList.remove("flipped");
          cardEl.classList.remove("locked");

          // ✅ 从洗好的牌堆里取一张（不重复）
          if (deck.length > 0) {
            currentCard = deck.pop();
          } else {
            // 牌堆空了（理论上不会发生，因为 DRAW_LIMIT=8 < 41）
            currentCard = cards[Math.floor(Math.random() * cards.length)];
          }

          cardFrontEl.innerHTML = "";

          cardBackEl.innerHTML = "";
          const hint = document.createElement("div");
          hint.className = "back-hint";
          hint.textContent = "TAP TO REVEAL THE CARD!";
          cardBackEl.appendChild(hint);

          tapHint.textContent = "";

          againBtn.disabled = true;
          againBtn.textContent = "DRAW AGAIN";
        }

        function revealFront() {
          if (state !== 0 || !currentCard) return;

          cardFrontEl.innerHTML = "";
          cardFrontEl.appendChild(createImg(currentCard.front, "Card front"));

          isFlipped = true;
          cardEl.classList.add("flipped");

          state = 1;

          if (!hasFlippedBack) {
            tapHint.textContent = "Tap to reveal the interpretation";
          } else {
            tapHint.textContent = "Tap again to reveal the interpretation";
          }
        }

        function revealBack() {
          if (state !== 1 || !currentCard) return;

          cardBackEl.innerHTML = "";
          cardBackEl.appendChild(createImg(currentCard.back, "Card back"));

          isFlipped = false;
          cardEl.classList.remove("flipped");

          state = 2;
          hasFlippedBack = true;

          tapHint.textContent = "Tap again to see the front";

          addToCollection(cards.indexOf(currentCard));

          setTimeout(() => {
            if (drawnCount >= DRAW_LIMIT) {
              againBtn.disabled = true;
              againBtn.textContent = "LIMIT REACHED";
              cardEl.classList.add("locked");
              tapHint.textContent = "All 8 cards drawn! Press START OVER.";
            } else {
              againBtn.disabled = false;
            }
          }, 800);
        }

        function backToFront() {
          if (state !== 2 || !currentCard) return;

          isFlipped = true;
          cardEl.classList.add("flipped");

          state = 1;
          tapHint.textContent = "Tap again to reveal the back";
        }

        function onCardClick() {
          if (!currentCard) return;
          if (state === 0) revealFront();
          else if (state === 1) revealBack();
          else if (state === 2) backToFront();
        }

        function onDrawAgain() {
          if (drawnCount >= DRAW_LIMIT) return;
          drawnCount++;
          updateCounter();

          isFlipped = false;
          cardEl.classList.remove("flipped");

          setTimeout(() => {
            showPurpleBack();
          }, 500);
        }

        function openCollection() {
          const list = getCollection();
          collectionGrid.innerHTML = "";
          lightboxCards = list;

          if (list.length === 0) {
            collectionEmpty.style.display = "block";
            collectionGrid.style.display = "none";
          } else {
            collectionEmpty.style.display = "none";
            collectionGrid.style.display = "grid";
            list.forEach((cardIndex, i) => {
              const card = cards[cardIndex];
              if (!card) return;

              const item = document.createElement("div");
              item.className = "collection-item";
              const img = document.createElement("img");
              img.src = card.front;
              img.alt = "";
              item.appendChild(img);

              item.addEventListener("click", () => {
                lightboxIndex = i;
                lightboxShowBack = false;
                openLightbox();
              });

              collectionGrid.appendChild(item);
            });
          }

          collectionModal.classList.add("show");
        }

        function openLightbox() {
          const cardIndex = lightboxCards[lightboxIndex];
          const card = cards[cardIndex];
          if (!card) return;

          lightboxImg.src = lightboxShowBack ? card.back : card.front;
          lightbox.classList.add("show");
        }

        function toggleLightboxSide() {
          lightboxShowBack = !lightboxShowBack;
          const cardIndex = lightboxCards[lightboxIndex];
          const card = cards[cardIndex];
          if (!card) return;

          lightboxImg.style.transition = "opacity 0.2s";
          lightboxImg.style.opacity = "0";
          setTimeout(() => {
            lightboxImg.src = lightboxShowBack ? card.back : card.front;
            lightboxImg.style.opacity = "1";
          }, 150);
        }

        function closeCollection() {
          collectionModal.classList.remove("show");
        }

        function closeLightbox() {
          lightbox.classList.remove("show");
          lightboxImg.src = "";
        }

        function getNameFromURL() {
          const params = new URLSearchParams(window.location.search);
          return (params.get("name") || "").trim();
        }

        cardEl.addEventListener("click", onCardClick);
        againBtn.addEventListener("click", onDrawAgain);
        homeBtn.addEventListener("click", () => {
          localStorage.removeItem(STORAGE_KEY);
          window.location.href = "index.html";
        });
        collectionBtn.addEventListener("click", openCollection);
        collectionClose.addEventListener("click", closeCollection);
        collectionModal.addEventListener("click", (e) => {
          if (e.target === collectionModal) closeCollection();
        });
        lightbox.addEventListener("click", (e) => {
          if (e.target === lightboxImg) {
            toggleLightboxSide();
          } else {
            closeLightbox();
          }
        });

        function init() {
          currentName = getNameFromURL();
          if (currentName) {
            nameTitle.textContent = currentName;
          } else {
            window.location.href = "index.html";
            return;
          }

          localStorage.removeItem(STORAGE_KEY);
          localStorage.setItem(NAME_KEY, currentName);

          drawnCount = 0;
          updateCounter();

          // ✅ 洗牌：40 张随机排列，前 8 张不重复
          deck = shuffle(cards);

          createFloatItems();
          showPurpleBack();
        }

        init();
      })();
    </script>
  </body>
</html>
